name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # CI: valida el código en cada push y pull request
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar HTML
        run: npx --yes htmlhint index.html

      - name: Validar sintaxis de JavaScript
        run: node --check script.js

  # CD: publica en GitHub Pages solo si el CI pasa y es un push a main
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar archivos del sitio
        run: |
          mkdir _site
          cp index.html styles.css script.js _site/
          # Cache busting: versiona CSS y JS con el commit para que el navegador no use copias viejas
          sed -i "s/styles\.css\"/styles.css?v=${GITHUB_SHA::7}\"/; s/script\.js\"/script.js?v=${GITHUB_SHA::7}\"/" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
